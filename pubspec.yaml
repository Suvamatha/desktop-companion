name: desktop_companion
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Window control
  window_manager: ^0.3.9
  screen_retriever: ^0.1.9

  # Animation
  rive: ^0.13.15
  lottie: ^3.1.2

  # System tray
  system_tray: ^2.0.3

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # State management
  provider: ^6.1.2

  # Networking
  http: ^1.2.1

  # Battery
  battery_plus: ^6.0.1

  # Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9